[package]
name = "majsoul-assets"
version.workspace = true
edition = "2024"

[dependencies]
aes = "0.8"
anyhow = "1"
base64 = "0.22"
cbc = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3"
time = { version = "0.3", features = ["macros", "parsing"] }
unity_rs_core = { package = "unity-rs-core", git = "https://github.com/seiunx-dev/unity-rs", rev = "b3e509ed09fe6ff3a897d04ddb75eb5214482265" }
