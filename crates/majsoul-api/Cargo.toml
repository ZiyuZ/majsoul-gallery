[package]
name = "majsoul-api"
version.workspace = true
edition = "2024"
description = "Read-only Mahjong Soul account client"

[dependencies]
anyhow = "1"
futures-util = { version = "0.3", features = ["sink"] }
hmac = "0.12"
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
unity_rs_core = { package = "unity-rs-core", git = "https://github.com/seiunx-dev/unity-rs", rev = "b3e509ed09fe6ff3a897d04ddb75eb5214482265" }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[build-dependencies]
protox = "0.10"
