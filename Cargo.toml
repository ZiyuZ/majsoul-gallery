[package]
name = "majsoul-gallery"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/majsoul-api", "crates/majsoul-assets", "crates/xtask"]
exclude = ["tools/majsoul-assetviewer/src-tauri"]
default-members = ["."]

[features]
default = []
spine = ["dep:rusty_spine", "dep:bytemuck", "dep:pollster", "dep:wgpu"]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive"] }
bytemuck = { version = "1.25", features = ["derive"], optional = true }
gpui-kit = "0.8.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
majsoul-assets = { path = "crates/majsoul-assets" }
majsoul-api = { path = "crates/majsoul-api" }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }
pinyin = { version = "0.11", default-features = false, features = ["plain"] }
pollster = { version = "0.4", optional = true }
rfd = "0.17"
rusty_spine = { version = "=0.8.0", optional = true }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
wgpu = { version = "30", default-features = false, features = ["dx12", "std", "wgsl"], optional = true }
webp-animation = { version = "0.10", default-features = false, features = ["static"] }
resvg = "0.45.1"

[build-dependencies]
embed-resource = "3"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Registry", "Win32_System_Console"] }

[profile.dev]
debug = 0

[profile.dev.package.fdeflate]
opt-level = 2

[profile.dev.package.gpui-component]
opt-level = 2

[profile.dev.package.gpui-pre]
opt-level = 2

[profile.dev.package.image]
opt-level = 2

[profile.dev.package.majsoul-assets]
opt-level = 2

[profile.dev.package.majsoul-gallery]
opt-level = 2

[profile.dev.package.png]
opt-level = 2

[profile.dev.package.libwebp-sys2]
opt-level = 3

[profile.dev.package.webp-animation]
opt-level = 2

[profile.dev.package.resvg]
opt-level = 2

[profile.dev.package.rusty_spine]
opt-level = 2

[profile.dev.package.texture2ddecoder]
opt-level = 2

[profile.dev.package.unity-rs-core]
opt-level = 2

[profile.release]
strip = true
lto = "thin"
